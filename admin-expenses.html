<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>খরচ | SubTrack Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/receipt.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E40AF">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div id="pageLoader" class="page-loader" role="status" aria-live="polite">
    <span class="spinner spinner-dark spinner-lg"></span>
    <span>অপেক্ষা করুন...</span>
  </div>

  <div id="app" class="app"></div>

  <template id="pageTemplate">
    <div class="page-header">
      <div>
        <h1 class="page-title">খরচ ব্যবস্থাপনা</h1>
        <p class="page-sub">অফিসের খরচ যোগ, সম্পাদনা ও হিসাব দেখুন</p>
      </div>
      <button type="button" class="btn" id="addExpenseBtn">+ নতুন খরচ</button>
    </div>

    <section class="stats-grid" aria-label="সারসংক্ষেপ">
      <div class="stat-card danger">
        <div class="stat-label">মোট খরচ</div>
        <div class="stat-value" id="statTotal">—</div>
        <div class="stat-note" id="statPeriod"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">এন্ট্রি সংখ্যা</div>
        <div class="stat-value" id="statCount">—</div>
      </div>
      <div class="stat-card warning">
        <div class="stat-label">সর্বোচ্চ খরচের খাত</div>
        <div class="stat-value" id="statTop" style="font-size:20px">—</div>
        <div class="stat-note" id="statTopNote"></div>
      </div>
    </section>

    <section class="card">
      <div class="toolbar">
        <input type="month" id="monthFilter" class="form-control month-input" aria-label="মাস নির্বাচন">
        <button type="button" class="btn btn-secondary btn-sm" id="allMonthsBtn">সব মাস</button>
        <select id="categoryFilter" class="form-control month-input" aria-label="খাত ফিল্টার"></select>
        <input type="search" id="searchInput" class="form-control search-box"
               placeholder="শিরোনাম বা নোট দিয়ে খুঁজুন" aria-label="খরচ খুঁজুন" autocomplete="off">
      </div>
      <div id="listArea" aria-live="polite"></div>
      <div id="pagination" class="pagination hidden"></div>
    </section>
  </template>

  <script type="module" src="js/admin-expenses.js"></script>
</body>
</html>
